 class="line">305</span><br><span class="line">306</span><br><span class="line">307</span><br></pre></td><td class="code"><pre><span class="line"></span><br><span class="line"># -*- coding: utf-8 -*-</span><br><span class="line"></span><br><span class="line">&quot;&quot;&quot;</span><br><span class="line"></span><br><span class="line">将远程 BMP 图像批量生成 PNG 缩略图并导出到本地。</span><br><span class="line"></span><br><span class="line">远程目录只读，本脚本只读取远程、写入本地输出目录。</span><br><span class="line"></span><br><span class="line">支持从 config.txt 中按奇偶行读取多组 (REMOTE_DIR, DATE_NAME) 批量处理。</span><br><span class="line"></span><br><span class="line">&quot;&quot;&quot;</span><br><span class="line"></span><br><span class="line">import os</span><br><span class="line"></span><br><span class="line">import sys</span><br><span class="line"></span><br><span class="line">from html import escape</span><br><span class="line"></span><br><span class="line">from concurrent.futures import ThreadPoolExecutor, as_completed</span><br><span class="line"></span><br><span class="line">from PIL import Image</span><br><span class="line"></span><br><span class="line"># ---------- 配置 ----------</span><br><span class="line"></span><br><span class="line">CONFIG_FILE = &quot;config.txt&quot;      # 配置文件路径（奇数行 REMOTE_DIR，偶数行 DATE_NAME）</span><br><span class="line"></span><br><span class="line">THUMB_WIDTH = 400              # 缩略图宽度（px），高度等比</span><br><span class="line"></span><br><span class="line">MAX_WORKERS = 8                # 多线程线程数（加速网络传输读取）</span><br><span class="line"></span><br><span class="line">OUTPUT_ROOT = os.path.dirname(os.path.abspath(__file__))</span><br><span class="line"></span><br><span class="line"># ---------------------------</span><br><span class="line"></span><br><span class="line">def load_config(config_path):</span><br><span class="line"></span><br><span class="line">    &quot;&quot;&quot;读取 txt 配置文件，奇数行为 REMOTE_DIR，偶数行为 DATE_NAME&quot;&quot;&quot;</span><br><span class="line"></span><br><span class="line">    if not os.path.exists(config_path):</span><br><span class="line"></span><br><span class="line">        print(f&quot;[错误] 找不到配置文件: &#123;config_path&#125;&quot;)</span><br><span class="line"></span><br><span class="line">        print(&quot;请在脚本同目录下创建 config.txt，格式如下：&quot;)</span><br><span class="line"></span><br><span class="line">        print(&quot;第一行 (REMOTE_DIR): \\\\server\\share\\path1&quot;)</span><br><span class="line"></span><br><span class="line">        print(&quot;第二行 (DATE_NAME) : 20250915&quot;)</span><br><span class="line"></span><br><span class="line">        sys.exit(1)</span><br><span class="line"></span><br><span class="line">    with open(config_path, &quot;r&quot;, encoding=&quot;utf-8&quot;) as f:</span><br><span class="line"></span><br><span class="line">        lines = [line.strip() for line in f if line.strip() and not line.strip().startswith(&quot;#&quot;)]</span><br><span class="line"></span><br><span class="line">    if len(lines) % 2 != 0:</span><br><span class="line"></span><br><span class="line">        print(&quot;[警告] 配置文件有效行数为奇数，最后一行缺失配对的 DATE_NAME，将被忽略！&quot;)</span><br><span class="line"></span><br><span class="line">        lines = lines[:-1]</span><br><span class="line"></span><br><span class="line">    tasks_config = []</span><br><span class="line"></span><br><span class="line">    for i in range(0, len(lines), 2):</span><br><span class="line"></span><br><span class="line">        remote_dir = lines[i]</span><br><span class="line"></span><br><span class="line">        date_name = lines[i + 1]</span><br><span class="line"></span><br><span class="line">        tasks_config.append((remote_dir, date_name))</span><br><span class="line"></span><br><span class="line">    return tasks_config</span><br><span class="line"></span><br><span class="line">def process_single_image(args):</span><br><span class="line"></span><br><span class="line">    &quot;&quot;&quot;单张图片处理逻辑，供线程池并发调用&quot;&quot;&quot;</span><br><span class="line"></span><br><span class="line">    src, out_path, thumb_rel_path, thumb_width = args</span><br><span class="line"></span><br><span class="line">    try:</span><br><span class="line"></span><br><span class="line">        with open(src, &quot;rb&quot;) as fh:</span><br><span class="line"></span><br><span class="line">            img = Image.open(fh)</span><br><span class="line"></span><br><span class="line">            img.load()</span><br><span class="line"></span><br><span class="line">        w, h = img.size</span><br><span class="line"></span><br><span class="line">        if w &amp;gt; thumb_width:</span><br><span class="line"></span><br><span class="line">            new_w = thumb_width</span><br><span class="line"></span><br><span class="line">            new_h = round(h * (thumb_width / w))</span><br><span class="line"></span><br><span class="line">        else:</span><br><span class="line"></span><br><span class="line">            new_w, new_h = w, h</span><br><span class="line"></span><br><span class="line">        img = img.resize((new_w, new_h), Image.LANCZOS)</span><br><span class="line"></span><br><span class="line">        if img.mode != &quot;RGB&quot;:</span><br><span class="line"></span><br><span class="line">            img = img.convert(&quot;RGB&quot;)</span><br><span class="line"></span><br><span class="line">        img.save(out_path, &quot;PNG&quot;)</span><br><span class="line"></span><br><span class="line">        return True, src, thumb_rel_path, None</span><br><span class="line"></span><br><span class="line">    except Exception as e:</span><br><span class="line"></span><br><span class="line">        return False, src, None, str(e)</span><br><span class="line"></span><br><span class="line">def process_batch(remote_dir, date_name):</span><br><span class="line"></span><br><span class="line">    &quot;&quot;&quot;处理一组 (REMOTE_DIR, DATE_NAME) 任务&quot;&quot;&quot;</span><br><span class="line"></span><br><span class="line">    print(f&quot;\n==================================================&quot;)</span><br><span class="line"></span><br><span class="line">    print(f&quot;开始处理任务: [&#123;date_name&#125;]&quot;)</span><br><span class="line"></span><br><span class="line">    print(f&quot;远程路径: &#123;remote_dir&#125;&quot;)</span><br><span class="line"></span><br><span class="line">    print(f&quot;==================================================&quot;)</span><br><span class="line"></span><br><span class="line">    out_dir   = os.path.join(OUTPUT_ROOT, date_name)</span><br><span class="line"></span><br><span class="line">    thumb_rel = &quot;thumbs&quot;</span><br><span class="line"></span><br><span class="line">    thumb_dir = os.path.join(out_dir, thumb_rel)</span><br><span class="line"></span><br><span class="line">    os.makedirs(thumb_dir, exist_ok=True)</span><br><span class="line"></span><br><span class="line">    try:</span><br><span class="line"></span><br><span class="line">        files = sorted(f for f in os.listdir(remote_dir) if f.lower().endswith(&quot;.bmp&quot;))</span><br><span class="line"></span><br><span class="line">    except FileNotFoundError as e:</span><br><span class="line"></span><br><span class="line">        print(f&quot;[错误] 无法访问远程目录: &#123;e&#125;&quot;)</span><br><span class="line"></span><br><span class="line">        return</span><br><span class="line"></span><br><span class="line">    except PermissionError as e:</span><br><span class="line"></span><br><span class="line">        print(f&quot;[错误] 拒绝访问，请检查权限或网络登录凭据: &#123;e&#125;&quot;)</span><br><span class="line"></span><br><span class="line">        return</span><br><span class="line"></span><br><span class="line">    total = len(files)</span><br><span class="line"></span><br><span class="line">    if total == 0:</span><br><span class="line"></span><br><span class="line">        print(&quot;[提示] 该远程目录下未找到 BMP 文件。&quot;)</span><br><span class="line"></span><br><span class="line">        return</span><br><span class="line"></span><br><span class="line">    print(f&quot;共发现 &#123;total&#125; 个 BMP 文件，启动 &#123;MAX_WORKERS&#125; 线程处理中...&quot;)</span><br><span class="line"></span><br><span class="line">    tasks = []</span><br><span class="line"></span><br><span class="line">    for name in files:</span><br><span class="line"></span><br><span class="line">        src      = os.path.join(remote_dir, name)</span><br><span class="line"></span><br><span class="line">        out_name = os.path.splitext(name)[0] + &quot;.png&quot;</span><br><span class="line"></span><br><span class="line">        out_path = os.path.join(thumb_dir, out_name)</span><br><span class="line"></span><br><span class="line">        rel_path = os.path.join(thumb_rel, out_name)</span><br><span class="line"></span><br><span class="line">        tasks.append((src, out_path, rel_path, THUMB_WIDTH))</span><br><span class="line"></span><br><span class="line">    ok, fail = 0, 0</span><br><span class="line"></span><br><span class="line">    records = []</span><br><span class="line"></span><br><span class="line">    # 使用线程池加速远程文件 IO 读取</span><br><span class="line"></span><br><span class="line">    with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:</span><br><span class="line"></span><br><span class="line">        futures = [executor.submit(process_single_image, task) for task in tasks]</span><br><span class="line"></span><br><span class="line">        for i, future in enumerate(as_completed(futures), 1):</span><br><span class="line"></span><br><span class="line">            success, src, rel_path, err_msg = future.result()</span><br><span class="line"></span><br><span class="line">            if success:</span><br><span class="line"></span><br><span class="line">                ok += 1</span><br><span class="line"></span><br><span class="line">                records.append((src, rel_path))</span><br><span class="line"></span><br><span class="line">            else:</span><br><span class="line"></span><br><span class="line">                fail += 1</span><br><span class="line"></span><br><span class="line">                print(f&quot;  [失败] &#123;os.path.basename(src)&#125;: &#123;err_msg&#125;&quot;)</span><br><span class="line"></span><br><span class="line">            if i % 20 == 0 or i == total:</span><br><span class="line"></span><br><span class="line">                print(f&quot;  进度 &#123;i&#125;/&#123;total&#125;&quot;)</span><br><span class="line"></span><br><span class="line">    # 按文件名重新排序记录</span><br><span class="line"></span><br><span class="line">    records.sort(key=lambda x: x[1])</span><br><span class="line"></span><br><span class="line">    print(f&quot;任务 [&#123;date_name&#125;] 完成：成功 &#123;ok&#125;，失败 &#123;fail&#125;。缩略图目录: &#123;thumb_dir&#125;&quot;)</span><br><span class="line"></span><br><span class="line">    # 生成预览 HTML</span><br><span class="line"></span><br><span class="line">    html_path = os.path.join(out_dir, &quot;index.html&quot;)</span><br><span class="line"></span><br><span class="line">    make_html(html_path, date_name, records)</span><br><span class="line"></span><br><span class="line">    print(f&quot;预览页: &#123;html_path&#125;&quot;)</span><br><span class="line"></span><br><span class="line">def make_html(path, date_name, records):</span><br><span class="line"></span><br><span class="line">    cards = []</span><br><span class="line"></span><br><span class="line">    for _src, tp in records:</span><br><span class="line"></span><br><span class="line">        base = os.path.basename(tp)</span><br><span class="line"></span><br><span class="line">        # 替换斜杠确保网页路径格式正确</span><br><span class="line"></span><br><span class="line">        web_tp = tp.replace(&quot;\\&quot;, &quot;/&quot;)</span><br><span class="line"></span><br><span class="line">        cards.append(</span><br><span class="line"></span><br><span class="line">            f&#x27;&amp;lt;a class=&quot;card&quot; href=&quot;&#123;escape(web_tp)&#125;&quot; target=&quot;_blank&quot;&amp;gt;&#x27;</span><br><span class="line"></span><br><span class="line">            f&#x27;&amp;lt;img src=&quot;&#123;escape(web_tp)&#125;&quot; loading=&quot;lazy&quot; alt=&quot;&#123;escape(base)&#125;&quot;/&amp;gt;&#x27;</span><br><span class="line"></span><br><span class="line">            f&#x27;&amp;lt;div class=&quot;cap&quot;&amp;gt;&#123;escape(base)&#125;&amp;lt;/div&amp;gt;&amp;lt;/a&amp;gt;&#x27;</span><br><span class="line"></span><br><span class="line">        )</span><br><span class="line"></span><br><span class="line">    cards_html = &quot;\n&quot;.join(cards)</span><br><span class="line"></span><br><span class="line">    html = f&quot;&quot;&quot;&amp;lt;!DOCTYPE html&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;html lang=&quot;zh&quot;&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;head&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;meta charset=&quot;utf-8&quot;/&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;/&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;title&amp;gt;&#123;escape(date_name)&#125; 缩略图预览&amp;lt;/title&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;style&amp;gt;</span><br><span class="line"></span><br><span class="line">body&#123;&#123;font-family:sans-serif;margin:20px;background:#1e1e1e;color:#ddd&#125;&#125;</span><br><span class="line"></span><br><span class="line">h1&#123;&#123;font-size:18px;margin-bottom:14px&#125;&#125;</span><br><span class="line"></span><br><span class="line">.grid&#123;&#123;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px&#125;&#125;</span><br><span class="line"></span><br><span class="line">.card&#123;&#123;background:#2c2c2c;border:1px solid #444;border-radius:6px;overflow:hidden;text-decoration:none;color:#ddd&#125;&#125;</span><br><span class="line"></span><br><span class="line">.card img&#123;&#123;width:100%;height:180px;object-fit:contain;background:#000;display:block&#125;&#125;</span><br><span class="line"></span><br><span class="line">.cap&#123;&#123;font-size:11px;padding:6px 8px;word-break:break-all&#125;&#125;</span><br><span class="line"></span><br><span class="line">&amp;lt;/style&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;/head&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;body&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;h1&amp;gt;&#123;escape(date_name)&#125; 共 &#123;len(records)&#125; 张&amp;lt;/h1&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;div class=&quot;grid&quot;&amp;gt;</span><br><span class="line"></span><br><span class="line">&#123;cards_html&#125;</span><br><span class="line"></span><br><span class="line">&amp;lt;/div&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;/body&amp;gt;</span><br><span class="line"></span><br><span class="line">&amp;lt;/html&amp;gt;&quot;&quot;&quot;</span><br><span class="line"></span><br><span class="line">    with open(path, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:</span><br><span class="line"></span><br><span class="line">        f.write(html)</span><br><span class="line"></span><br><span class="line">def main():</span><br><span class="line"></span><br><span class="line">    config_path = os.path.join(OUTPUT_ROOT, CONFIG_FILE)</span><br><span class="line"></span><br><span class="line">    tasks_config = load_config(config_path)</span><br><span class="line"></span><br><span class="line">    print(f&quot;成功载入 &#123;len(tasks_config)&#125; 组处理任务。&quot;)</span><br><span class="line"></span><br><span class="line">    for remote_dir, date_name in tasks_config:</span><br><span class="line"></span><br><span class="line">        process_batch(remote_dir, date_name)</span><br><span class="line"></span><br><span class="line">    print(&quot;\n[全部完成] 所有配置任务均已处理完毕！&quot;)</span><br><span class="line"></span><br><span class="line">if __name__ == &quot;__main__&quot;:</span><br><span class="line"></span><br><span class="line">    main()</span><br><span class="line"></span><br></pre></td></tr></table></figure>
