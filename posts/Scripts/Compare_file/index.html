s vs %s\n&quot;</span>, fileA-&gt;path, fileB-&gt;path);</span><br><span class="line">    <span class="keyword">if</span>(extension)&#123;</span><br><span class="line">        <span class="keyword">if</span> (<span class="built_in">strcmp</span>(extension,<span class="string">&quot;raw&quot;</span>) == <span class="number">0</span>)&#123;</span><br><span class="line">            PrintChannelStats(output, <span class="string">&quot;Raw&quot;</span>, b_counts, thr1, thr2, thr3, thr4, output_mode);</span><br><span class="line">        &#125; <span class="keyword">else</span> <span class="keyword">if</span> (<span class="built_in">strcmp</span>(extension,<span class="string">&quot;rgb&quot;</span>) == <span class="number">0</span>)&#123;</span><br><span class="line">            PrintChannelStats(output, <span class="string">&quot;Red&quot;</span>, r_counts, thr1, thr2, thr3, thr4, output_mode);</span><br><span class="line">            PrintChannelStats(output, <span class="string">&quot;Green&quot;</span>, g_counts, thr1, thr2, thr3, thr4, output_mode);</span><br><span class="line">            PrintChannelStats(output, <span class="string">&quot;Blue&quot;</span>, b_counts, thr1, thr2, thr3, thr4, output_mode);</span><br><span class="line">        &#125; <span class="keyword">else</span> <span class="keyword">if</span> (<span class="built_in">strcmp</span>(extension,<span class="string">&quot;yuv&quot;</span>) == <span class="number">0</span>)&#123;</span><br><span class="line">            PrintChannelStats(output, <span class="string">&quot;Y&quot;</span>, g_counts, thr1, thr2, thr3, thr4, output_mode);</span><br><span class="line">            PrintChannelStats(output, <span class="string">&quot;C&quot;</span>, b_counts, thr1, thr2, thr3, thr4, output_mode);</span><br><span class="line">        &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">            <span class="built_in">printf</span>(<span class="string">&quot;不支持文件拓展名：%s/n&quot;</span>, extension);</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="type">int</span> <span class="title function_">main</span><span class="params">(<span class="type">int</span> argc, <span class="type">char</span>* argv[])</span> &#123;</span><br><span class="line">    <span class="keyword">if</span> (argc &lt; <span class="number">10</span>) &#123;</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;Usage: %s folderA folderB extension thr1 thr2 thr3 thr4 output.txt\n&quot;</span>, argv[<span class="number">0</span>]);</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;Example: %s A B rgb 5 10 20 50 result.txt 0 \n&quot;</span>);</span><br><span class="line">        <span class="comment">//argv[9]=0 打印区间范围内点的个数，argv[9]=0 打印区间范围内点的占比</span></span><br><span class="line">        <span class="keyword">return</span> <span class="number">1</span>;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="type">const</span> <span class="type">char</span>* folderA = argv[<span class="number">1</span>];</span><br><span class="line">    <span class="type">const</span> <span class="type">char</span>* folderB = argv[<span class="number">2</span>];</span><br><span class="line">    <span class="type">const</span> <span class="type">char</span>* extension = argv[<span class="number">3</span>];</span><br><span class="line">    <span class="type">int</span> thr1 = atoi(argv[<span class="number">4</span>]);</span><br><span class="line">    <span class="type">int</span> thr2 = atoi(argv[<span class="number">5</span>]);</span><br><span class="line">    <span class="type">int</span> thr3 = atoi(argv[<span class="number">6</span>]);</span><br><span class="line">    <span class="type">int</span> thr4 = atoi(argv[<span class="number">7</span>]);</span><br><span class="line">    <span class="type">const</span> <span class="type">char</span>* outputFilename = argv[<span class="number">8</span>];</span><br><span class="line">    <span class="type">int</span> output_mode=atoi(argv[<span class="number">9</span>]);</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 验证阈值</span></span><br><span class="line">    <span class="keyword">if</span> (thr1 &gt;= thr2 || thr2 &gt;= thr3 || thr3 &gt;= thr4) &#123;</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;Error: Thresholds must be in increasing order\n&quot;</span>);</span><br><span class="line">        <span class="keyword">return</span> <span class="number">1</span>;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 打开输出文件</span></span><br><span class="line">    FILE* outputFile = fopen(outputFilename, <span class="string">&quot;w&quot;</span>);</span><br><span class="line">    <span class="keyword">if</span> (!outputFile) &#123;</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;Error: Cannot open output file %s\n&quot;</span>, outputFilename);</span><br><span class="line">        <span class="keyword">return</span> <span class="number">1</span>;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 获取文件列表</span></span><br><span class="line">    BinaryFile filesA[MAX_FILES], filesB[MAX_FILES];</span><br><span class="line">    <span class="type">int</span> countA = GetFiles(folderA, extension, filesA);</span><br><span class="line">    <span class="type">int</span> countB = GetFiles(folderB, extension, filesB);</span><br><span class="line"></span><br><span class="line">    <span class="keyword">if</span> (countA == <span class="number">0</span> || countB == <span class="number">0</span>) &#123;</span><br><span class="line">        <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Error: No matching files found\n&quot;</span>);</span><br><span class="line">        fclose(outputFile);</span><br><span class="line">        <span class="keyword">return</span> <span class="number">1</span>;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">if</span> (countA != countB) &#123;</span><br><span class="line">        <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Error: Different number of files (%d in A, %d in B)\n&quot;</span>, countA, countB);</span><br><span class="line">        fclose(outputFile);</span><br><span class="line">        <span class="keyword">return</span> <span class="number">1</span>;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 在输出文件中写入参数信息</span></span><br><span class="line">    <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Comparison Parameters:\n&quot;</span>);</span><br><span class="line">    </span><br><span class="line">    <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Folder A: %s\n&quot;</span>, folderA);</span><br><span class="line">    <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Folder B: %s\n&quot;</span>, folderB);</span><br><span class="line">    <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;File Extension: .%s\n&quot;</span>, extension);</span><br><span class="line">    <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Thresholds: %d, %d, %d, %d\n\n&quot;</span>, thr1, thr2, thr3, thr4);</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 读取并比较文件</span></span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">0</span>; i &lt; countA; i++) &#123;</span><br><span class="line">        <span class="keyword">if</span> (ReadBinaryFile(&amp;filesA[i]) || ReadBinaryFile(&amp;filesB[i])) &#123;</span><br><span class="line">            <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Error reading files: %s or %s\n&quot;</span>, filesA[i].path, filesB[i].path);</span><br><span class="line">            <span class="keyword">continue</span>;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="keyword">if</span> (filesA[i].dataCount != filesB[i].dataCount) &#123;</span><br><span class="line">            <span class="built_in">fprintf</span>(outputFile, <span class="string">&quot;Error: Data count mismatch in files %s and %s (%d != %d)\n&quot;</span>, </span><br><span class="line">                   filesA[i].path, filesB[i].path, filesA[i].dataCount, filesB[i].dataCount);</span><br><span class="line">            <span class="built_in">free</span>(filesA[i].data);</span><br><span class="line">            <span class="built_in">free</span>(filesB[i].data);</span><br><span class="line">            <span class="keyword">continue</span>;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        CompareFiles(outputFile, &amp;filesA[i], &amp;filesB[i], extension, thr1, thr2, thr3, thr4, output_mode);</span><br><span class="line"></span><br><span class="line">        <span class="built_in">free</span>(filesA[i].data);</span><br><span class="line">        <span class="built_in">free</span>(filesB[i].data);</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    fclose(outputFile);</span><br><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;Comparison completed. Results saved to %s\n&quot;</span>, outputFilename);</span><br><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
